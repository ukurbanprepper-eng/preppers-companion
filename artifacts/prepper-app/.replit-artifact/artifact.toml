kind = "web"
previewPath = "/"
title = "Prepper's Companion"
version = "1.0.0"
id = "artifacts/prepper-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23263

[services.development]
run = "pnpm --filter @workspace/prepper-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prepper-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/prepper-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23263"
BASE_PATH = "/"
