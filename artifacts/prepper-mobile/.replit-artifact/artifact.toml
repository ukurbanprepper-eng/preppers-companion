kind = "mobile"
previewPath = "/prepper-mobile/"
title = "Prepper's Companion Mobile"
version = "1.0.0"
id = "artifacts/prepper-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/prepper-mobile/" ]
localPort = 20081

[services.development]
run = "pnpm --filter @workspace/prepper-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prepper-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/prepper-mobile", "run", "serve" ]

[services.env]
PORT = "20081"
BASE_PATH = "/prepper-mobile/"
